name: Vigilar el token de Instagram

# El token de larga duración de Instagram caduca a los 60 días.
#
# Refrescarlo devuelve una cadena NUEVA (Meta no documenta si la anterior
# queda invalidada), así que refrescar sin guardar el resultado no sirve de
# nada: el secret se quedaría con el token viejo y el sistema moriría a los
# 60 días exactos, con la vigilancia dando verde cada semana.
#
# Por eso aquí NO se refresca a ciegas. Se comprueba que el token del secret
# siga siendo válido y se avisa por antigüedad, contando desde la fecha
# registrada en banco/token_emitido.txt. Renovarlo es un gesto manual de dos
# minutos, y es preferible eso a una automatización que aparenta funcionar.
on:
  schedule:
    - cron: "13 14 * * 1"   # lunes, 09:13 Bogotá
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar el token y su antigüedad
        id: check
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "estado=sin_token" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ¿Sigue siendo válido? Una llamada de solo lectura, sin refrescar.
          RESP=$(curl -s "https://graph.instagram.com/me?fields=id,username&access_token=$IG_TOKEN")
          if ! echo "$RESP" | grep -q '"id"'; then
            echo "La API rechazó el token: $RESP"
            echo "estado=invalido" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Token válido para: $(echo "$RESP" | grep -o '"username":"[^"]*"')"

          # ¿Cuánto le queda? Se cuenta desde la fecha de emisión registrada.
          if [ ! -f banco/token_emitido.txt ]; then
            echo "estado=sin_fecha" >> $GITHUB_OUTPUT
            exit 0
          fi
          EMITIDO=$(tr -d '[:space:]' < banco/token_emitido.txt)
          DIAS=$(( ( $(date +%s) - $(date -d "$EMITIDO" +%s) ) / 86400 ))
          RESTAN=$(( 60 - DIAS ))
          echo "Emitido el $EMITIDO — $DIAS días de antigüedad, quedan $RESTAN."
          echo "restan=$RESTAN" >> $GITHUB_OUTPUT
          if [ "$RESTAN" -lt 15 ]; then
            echo "estado=por_caducar" >> $GITHUB_OUTPUT
          else
            echo "estado=ok" >> $GITHUB_OUTPUT
          fi

      - name: Avisar por issue
        if: steps.check.outputs.estado != 'ok'
        uses: actions/github-script@v7
        with:
          script: |
            const estado = "${{ steps.check.outputs.estado }}";
            const restan = "${{ steps.check.outputs.restan }}";
            const renovar = [
              "**Cómo renovarlo** (dos minutos):",
              "",
              "1. Entra a la app *Mundo Motor Publicador* en developers.facebook.com,",
              "   caso de uso Instagram → *Generar tokens de acceso*.",
              "2. Genera un token nuevo para la cuenta @mundomotor.bike.",
              "3. Reemplaza el secret `IG_TOKEN` del repositorio.",
              "4. Actualiza `banco/token_emitido.txt` con la fecha de hoy (AAAA-MM-DD).",
            ].join("\n");
            const mensajes = {
              sin_token: "No hay ningún token configurado: el secret `IG_TOKEN` está vacío, así que el carrusel diario no se está publicando.",
              invalido: "**El token de Instagram dejó de ser válido y la publicación está caída.** Hasta que se reemplace, no sale nada.",
              por_caducar: `El token de Instagram caduca en unos **${restan} días**. Conviene renovarlo antes de que corte la publicación.`,
              sin_fecha: "Falta el archivo `banco/token_emitido.txt` con la fecha de emisión del token, así que no puedo avisar con antelación de su caducidad. Créalo con la fecha en formato AAAA-MM-DD.",
            };
            const titulo = "Token de Instagram: hay que renovarlo";
            const cuerpo = `${mensajes[estado]}\n\n${renovar}`;
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open",
            });
            if (abiertos.data.some(i => i.title === titulo)) {
              core.info("Ya hay un issue abierto sobre esto.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titulo, body: cuerpo,
            });

      - name: Avisar por WhatsApp
        if: steps.check.outputs.estado != 'ok'
        env:
          TEL: ${{ secrets.CALLMEBOT_PHONE }}
          KEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ESTADO: ${{ steps.check.outputs.estado }}
          RESTAN: ${{ steps.check.outputs.restan }}
        run: |
          if [ -z "$TEL" ] || [ -z "$KEY" ]; then
            echo "Sin CallMebot configurado."; exit 0
          fi
          case "$ESTADO" in
            invalido)    M="🚨 Mundo Motor: el token de Instagram CADUCÓ. La publicación automática está caída hasta que lo renueves." ;;
            por_caducar) M="🔑 Mundo Motor: el token de Instagram caduca en ~$RESTAN días. Renuévalo antes de que corte la publicación." ;;
            sin_token)   M="⚠️ Mundo Motor: no hay token de Instagram configurado, la publicación automática no está funcionando." ;;
            *)           M="⚠️ Mundo Motor: revisa el token de Instagram (estado: $ESTADO)." ;;
          esac
          M="$M Pasos: github.com/Spartan3003/mundomotor-social/issues"
          curl -sG "https://api.callmebot.com/whatsapp.php" \
            -d "phone=$TEL" -d "apikey=$KEY" --data-urlencode "text=$M" \
            --max-time 30 || echo "(no pude enviar el WhatsApp)"
